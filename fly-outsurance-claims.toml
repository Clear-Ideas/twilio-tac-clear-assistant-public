# fly.toml app configuration file generated for outsurance-claims-assistant on 2026-07-31T22:56:05+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'outsurance-claims-assistant'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile.outsurance-claims'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
